[package]
edition = "2024"
license.workspace = true
name = "api"
version = "0.1.0"

[dependencies]
chrono = { workspace = true }
dioxus = { features = ["fullstack"], workspace = true }
maximal-lottery = { optional = true, workspace = true }
nanoid = { optional = true, workspace = true }
num-rational = { optional = true, workspace = true }
num-traits = { optional = true, workspace = true }
nutype = { workspace = true }
opentelemetry = { optional = true, workspace = true }
opentelemetry-otlp = { optional = true, workspace = true }
opentelemetry_sdk = { optional = true, workspace = true }
serde = { workspace = true }
sqlx = { optional = true, workspace = true }
tokio = { features = ["macros"], optional = true, workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { optional = true, workspace = true }
tracing-subscriber = { optional = true, workspace = true }

[features]
server = [
  "dep:maximal-lottery",
  "dep:nanoid",
  "dep:num-rational",
  "dep:num-traits",
  "dep:sqlx",
  "dep:tokio",
  "dioxus/server",
  "opentelemetry",
  "opentelemetry-otlp",
  "opentelemetry_sdk",
  "tracing-opentelemetry",
  "tracing-subscriber",
]

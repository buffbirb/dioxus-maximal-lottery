[package]
edition = "2024"
license.workspace = true
name = "web"
version = "0.1.0"

[dependencies]
api = { workspace = true }
base64 = { optional = true, workspace = true }
chrono = { workspace = true }
dioxus = { features = ["fullstack", "router"], workspace = true }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
gloo-timers = { workspace = true }
http = { optional = true, workspace = true }
subtle = { optional = true, workspace = true }
time = { version = "0.3.44", default-features = false }
tokio = { features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
], optional = true, workspace = true }
tower-http = { optional = true, workspace = true }
tracing = { optional = true, workspace = true }
wasm-bindgen = { optional = true, workspace = true }
web-sys = { optional = true, workspace = true }

[features]
default = []
server = [
  "api/server",
  "dep:base64",
  "dep:http",
  "dep:subtle",
  "dep:tokio",
  "dep:tower-http",
  "dep:tracing",
  "dioxus/server",
]
web = ["dioxus/web", "dep:wasm-bindgen", "dep:web-sys", "dioxus-primitives/web"]

[dev-dependencies]
dioxus-ssr = "0.7"

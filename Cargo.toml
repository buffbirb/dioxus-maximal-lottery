[workspace]
members = [
  "packages/api",
  "packages/desktop",
  "packages/mobile",
  "packages/ui",
  "packages/web",
]
resolver = "3"

[workspace.dependencies]
dioxus = { version = "0.7.1" }
opentelemetry = { features = ["trace"], version = "0.32" }
opentelemetry-otlp = { features = ["grpc-tonic", "trace"], version = "0.32" }
opentelemetry_sdk = { features = ["rt-tokio", "trace"], version = "0.32" }
tokio = { version = "1" }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { features = [
  "env-filter",
  "fmt",
  "registry",
], version = "0.3" }

# workspace
api = { path = "packages/api" }
ui = { path = "packages/ui" }

[workspace]
members = ["packages/api", "packages/web"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.23.0"
chrono = { features = ["serde"], version = "0.4" }
dioxus = { version = "0.7.1" }
dioxus-icons = { default-features = false, version = "0.1.0" }
# Not on crates.io beyond a 0.0.0 placeholder, so tracked from git. The
# `dx components add` output vendored under `web/src/components` builds on it.
dioxus-primitives = { default-features = false, git = "https://github.com/DioxusLabs/components", version = "0.0.1" }
dioxus-ssr = "0.7"
gloo-timers = { features = ["futures"], version = "0.4" }
http = "1.4.2"
js-sys = "0.3"
maximal-lottery = "0.1.1"
nanoid = "0.5"
num-rational = "0.4"
num-traits = "0.2"
nutype = { features = ["serde"], version = "0.7" }
opentelemetry = { features = ["trace"], version = "0.32" }
opentelemetry-otlp = { default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
], version = "0.32" }
opentelemetry_sdk = { features = ["rt-tokio", "trace"], version = "0.32" }
serde = { features = ["derive"], version = "1" }
sqlx = { default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
], version = "0.8" }
subtle = "2.6.1"
time = { default-features = false, version = "0.3.55" }
tokio = { version = "1" }
tower-http = { features = ["auth", "trace"], version = "0.7.0" }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { features = [
  "env-filter",
  "fmt",
  "registry",
], version = "0.3" }
wasm-bindgen = "0.2.126"
web-sys = { features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlCanvasElement",
  "Location",
  "MediaQueryList",
  "Performance",
  "Window",
  "console",
], version = "0.3" }

# workspace
api = { path = "packages/api" }

[workspace]
members = [
  "packages/api",
  "packages/desktop",
  "packages/mobile",
  "packages/ui",
  "packages/web",
]
resolver = "3"

[workspace.dependencies]
chrono = { features = ["serde"], version = "0.4" }
diesel = { features = ["chrono", "postgres"], version = "2.2" }
diesel-async = { features = ["deadpool", "postgres"], version = "0.5" }
dioxus = { version = "0.7.1" }
gloo-timers = { features = ["futures"], version = "0.3" }
maximal-lottery = "0.1.1"
nanoid = "0.4"
num-rational = { features = ["num-bigint"], version = "0.4" }
num-traits = "0.2"
opentelemetry = { features = ["trace"], version = "0.32" }
opentelemetry-otlp = { features = ["grpc-tonic", "trace"], version = "0.32" }
opentelemetry_sdk = { features = ["rt-tokio", "trace"], version = "0.32" }
serde = { features = ["derive"], version = "1" }
tokio = { version = "1" }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { features = [
  "env-filter",
  "fmt",
  "registry",
], version = "0.3" }
wasm-bindgen = "0.2.126"
web-sys = { features = [
  "Clipboard",
  "Location",
  "Navigator",
  "Storage",
  "Window",
], version = "0.3" }

# workspace
api = { path = "packages/api" }
ui = { path = "packages/ui" }

# Render blueprint for dioxus-maximal-lottery.
#
# Deployment model:
# - dev: Continuously deployed from the latest commit on main via GitHub Actions.
#   The :dev tag is pushed by the Build workflow and deployed by the Deploy dev
#   workflow. The image.url below is the default, but the deploy hook always
#   overrides it with the exact tag being deployed.
#
# - prd: Manually deployed from a tag (e.g. v1.2.3) created through the GitHub
#   "Create release" UI. The Deploy prd workflow resolves the tag to a commit
#   SHA, runs Supabase migrations, deploys the :v1.2.3 image via the Render
#   deploy hook, and then retags that image as :prd so the blueprint remains
#   accurate.

version: "1"
name: dioxus-maximal-lottery

projects:
  - name: dioxus-maximal-lottery
    environments:
      - name: prd
        services:
          - type: web
            name: maximal-lottery-prd
            runtime: image
            plan: free
            image:
              url: ghcr.io/buffbirb/maximal-lottery-web:prd
              creds:
                fromRegistryCreds:
                  name: "dioxus-maximal-lottery Render GHCR Deploy"
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: IP
                value: 0.0.0.0
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false

      - name: dev
        services:
          - type: web
            name: maximal-lottery-dev
            runtime: image
            plan: free
            image:
              url: ghcr.io/buffbirb/maximal-lottery-web:dev
              creds:
                fromRegistryCreds:
                  name: "dioxus-maximal-lottery Render GHCR Deploy"
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: IP
                value: 0.0.0.0
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false

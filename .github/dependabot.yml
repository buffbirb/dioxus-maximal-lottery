version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      include: scope
      prefix: chore
    groups:
      dioxus:
        patterns:
          - "dioxus"
          - "dioxus-*"
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
    schedule:
      interval: daily

  - package-ecosystem: devcontainers
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

  - package-ecosystem: dotnet-sdk
    directory: /
    commit-message:
      include: scope
      prefix: chore
    ignore:
      # A new major moves with the AppHost's target framework.
      - dependency-name: dotnet-sdk
        update-types: ["version-update:semver-major"]
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    commit-message:
      include: scope
      prefix: ci
    schedule:
      interval: daily

  - package-ecosystem: nix
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

  # Outside .github/: Dependabot can change files there only in github-actions
  # updates, so GitHub refuses an npm pull request that touches them.
  - package-ecosystem: npm
    directories:
      - /tools/prek
      - /tools/supabase
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directory: /
    commit-message:
      include: scope
      prefix: chore
    groups:
      aspire:
        patterns:
          - "Aspire.*"
    schedule:
      interval: daily

  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

  - package-ecosystem: rust-toolchain
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: daily

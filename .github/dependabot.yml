version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      include: scope
      prefix: chore
    groups:
      rust-dependencies:
        patterns:
          - "*"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: weekly

  - package-ecosystem: dotnet-sdk
    directory: /
    commit-message:
      include: scope
      prefix: chore
    ignore:
      # A new major moves with the AppHost's target framework.
      - dependency-name: dotnet-sdk
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    commit-message:
      include: scope
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly

  # Outside .github/: Dependabot can change files there only in github-actions
  # updates, so GitHub refuses an npm pull request that touches them.
  - package-ecosystem: npm
    directories:
      - /tools/prek
      - /tools/supabase
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /apphost
    commit-message:
      include: scope
      prefix: chore
    groups:
      aspire:
        patterns:
          - "Aspire.*"
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: weekly

  - package-ecosystem: rust-toolchain
    directory: /
    commit-message:
      include: scope
      prefix: chore
    schedule:
      interval: weekly

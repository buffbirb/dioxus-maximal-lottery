name: Set up Rust
description: Install the Rust toolchain rust-toolchain.toml pins, and dx and sqlx-cli at the versions Cargo.lock pins, with the Cargo cache.

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@4b6fa09d0d1ef9740a0c332e31b9ae336f97efa0 # v1.28.0

    # The token lifts the GitHub API rate limit for release lookups.
    - name: Install dx and sqlx-cli
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: tools/install-cargo-tools.sh

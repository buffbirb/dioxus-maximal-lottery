name: Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    defaults:
      run:
        shell: devenv --quiet shell -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build release bundle
        run: dx bundle --locked --package web --platform web --release

      - name: Build container image
        id: build
        run: |
          image=$(nix build -f image.nix --no-link --print-out-paths)
          echo "store-path=${image}" >> "${GITHUB_OUTPUT}"

      - name: Push container image to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for ref in "${sha}" "latest"; do
            skopeo copy --insecure-policy \
              "docker-archive:${{ steps.build.outputs.store-path }}" \
              "docker://${repo}:${ref}" \
              --dest-creds "${{ github.actor }}:${GHCR_TOKEN}"
          done

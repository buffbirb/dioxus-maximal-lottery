name: Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: read
      packages: write

    defaults:
      run:
        shell: devenv --quiet shell -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Retried because devenv eval can fail nondeterministically with
      # "path '...' is not valid" while registering flake source files in
      # the store; paths added before a failure persist, so retries make
      # monotone progress.
      - name: Build devenv shell
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            devenv --verbose shell -- true && exit 0
            echo "devenv shell eval failed (attempt ${attempt}); retrying"
          done
          exit 1

      - name: Cache Rust crates
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cmd-format: devenv --quiet shell -- {0}

      - name: Build release bundle
        run: dx bundle --locked --package web --platform web --release

      - name: Build container image
        id: build
        run: |
          image=$(nix build -f image.nix --no-link --print-out-paths)
          echo "store-path=$image" >> "$GITHUB_OUTPUT"

      - name: Push container image to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for ref in "sha-${sha}" latest; do
            skopeo copy --insecure-policy \
              "docker-archive:${{ steps.build.outputs.store-path }}" \
              "docker://$repo:$ref" \
              --dest-creds "${{ github.actor }}:$GHCR_TOKEN"
          done

# Bundle the web app with dx, build the Nix container image around it, and push
# that image to GHCR.
#
# Tagging model:
# - Automatic main runs and manual branch runs push the exact commit SHA
#   (e.g. :abc123). The :dev tag is set by the Deploy dev workflow *after* a
#   successful deploy (promote step).
# - A release tag push (e.g. v1.2.3) pushes :v1.2.3 and the exact SHA. The
#   Deploy prd workflow can then deploy that release tag to production.

name: Build image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bundle and image (defaults to the selected branch)
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: Git ref to bundle and image (branch, tag, or SHA)
        type: string
        required: true
    outputs:
      sha:
        description: Commit SHA whose image was built and pushed
        value: ${{ jobs.build-image.outputs.sha }}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: build-image-${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build image
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.tags.outputs.sha }}

    permissions:
      actions: read
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        shell: devenv --quiet shell --option env.DATABASE_URL:string "postgres://postgres:postgres@127.0.0.1:5432/postgres" -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Compute checkout ref
        id: meta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            echo "ref=${INPUT_REF}" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            echo "ref=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout ${{ steps.meta.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tags=${GITHUB_REF_NAME} ${sha}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${sha}" >> "${GITHUB_OUTPUT}"
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv

      - name: Run database migrations
        shell: bash
        run: devenv --quiet tasks run db:migrate --mode single --option env.DATABASE_URL:string "postgres://postgres:postgres@127.0.0.1:5432/postgres"

      - name: Bundle web app
        run: dx bundle --locked --package web --platform web --release

      - name: Build container image
        id: image
        run: |
          image=$(nix build -f image.nix --no-link --print-out-paths)
          echo "store-path=${image}" >> "${GITHUB_OUTPUT}"

      - name: Push container image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/maximal-lottery-web"
          for tag in ${{ steps.tags.outputs.tags }}; do
            skopeo copy --insecure-policy \
              "docker-archive:${{ steps.image.outputs.store-path }}" \
              "docker://${repo}:${tag}" \
              --dest-creds "${{ github.actor }}:${GHCR_TOKEN}"
          done

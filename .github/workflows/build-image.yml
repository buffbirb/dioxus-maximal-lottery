# Bundle the web app with dx, build the container image around it from the
# Dockerfile, and push that image to GHCR.
#
# Tagging model:
# - Automatic main runs and manual branch runs push the exact commit SHA
#   (e.g. :abc123). The :dev tag is set by the Deploy dev workflow *after* a
#   successful deploy (promote step).
# - A release tag push (e.g. v1.2.3) pushes :v1.2.3 and the exact SHA. The
#   Deploy prd workflow can then deploy that release tag to production.
# - A pull request that changes how the image is built builds it, but pushes
#   nothing.

name: Build image

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/build-image.yml
      - Dockerfile
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: Git ref to bundle and image (branch, tag, or SHA)
        required: true
        type: string
    outputs:
      sha:
        description: Commit SHA whose image was built and pushed
        value: ${{ jobs.build-image.outputs.sha }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bundle and image (defaults to the selected branch)
        required: false
        type: string
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: ["CI"]

permissions: {}

concurrency:
  group: build-image-${{ inputs.ref || github.event.workflow_run.head_sha || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build image
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Not ubuntu-latest, which follows each new Ubuntu LTS: the server needs a
    # glibc at least as new as the runner's, so the Dockerfile's base decides
    # this, and the two move together.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      sha: ${{ steps.tags.outputs.sha }}

    permissions:
      actions: read
      contents: read
      packages: write

    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/maximal-lottery-web

    steps:
      - name: Compute checkout ref
        id: meta
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: echo "ref=${INPUT_REF:-${HEAD_SHA}}" >> "${GITHUB_OUTPUT}"

      - name: Checkout ${{ steps.meta.outputs.ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.ref }}

      - name: Compute image tags
        id: tags
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tags=${GITHUB_REF_NAME} ${sha}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${sha}" >> "${GITHUB_OUTPUT}"
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # With no DATABASE_URL, sqlx checks queries against .sqlx/, which CI
      # checks against the migrations.
      - name: Bundle the web app
        run: dx bundle --locked --package web --platform web --release

      - name: Build the container image
        env:
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          podman build \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${REPOSITORY}:${SHA}" \
            .

      - name: Push the container image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tags.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          podman login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GHCR_TOKEN}"
          for tag in ${TAGS}; do
            podman push "${REPOSITORY}:${SHA}" "docker://${REPOSITORY}:${tag}"
          done

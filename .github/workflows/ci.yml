name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        shell: devenv --quiet shell -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv

      - name: Run database migrations
        run: |
          for migration in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 "${DATABASE_URL}" -f "${migration}"
          done

      - name: Run git hooks
        run: prek run --all-files

      - name: Build shared crates
        run: cargo build --locked --package api --package ui --all-features

      - name: Build fullstack app
        run: dx build --locked --package web --platform web

      - name: Run Rust tests
        run: cargo test --locked --package api --package ui --all-features

      - name: Run clippy
        run: cargo clippy --locked --workspace --exclude desktop --exclude mobile --all-targets --all-features -- -D warnings

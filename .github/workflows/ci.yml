name: CI

# Pull requests run whatever their base branch, so every layer of a stack gets CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# The ruleset requires only `CI`, which needs every job; a skipped job passes it.
jobs:
  apphost:
    name: AppHost
    needs: changes
    if: needs.changes.outputs.apphost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      apphost: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apphost == 'true' }}
      nix: ${{ github.event_name != 'pull_request' || steps.filter.outputs.nix == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}

    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            apphost:
              - .github/actions/setup-dotnet/**
              - .github/workflows/ci.yml
              - Directory.Packages.props
              - apphost/**
              - dioxus-maximal-lottery.slnx
              - global.json
            nix:
              - .github/workflows/ci.yml
              - flake.lock
              - flake.nix
              - global.json
              - rust-toolchain.toml
            rust:
              - .github/actions/setup-rust/**
              - .github/workflows/ci.yml
              - .sqlx/**
              - Cargo.lock
              - Cargo.toml
              - packages/**
              - rust-toolchain.toml
              - supabase/migrations/**
              - tools/install-cargo-tools.sh

  ci:
    name: CI
    needs: [apphost, changes, lint, nix, rust, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            while IFS= read -r job; do echo "::error::$job"; done <<< "$failed"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the rustfmt and dx fmt hooks.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up prek
        uses: ./.github/actions/setup-prek

      # The runner has no deadnix, nixfmt or statix.
      - name: Run hooks
        env:
          SKIP: deadnix,nixfmt,statix
        run: tools/prek/node_modules/.bin/prek run --all-files --color=always --show-diff-on-failure

  nix:
    name: Nix
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          github_access_token: ${{ github.token }}

      - name: Evaluate the dev shell for every system
        run: |
          for system in aarch64-darwin aarch64-linux x86_64-linux; do
            nix eval --raw ".#devShells.${system}.default.drvPath"
            echo
          done

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    # A migrated database, which sqlx checks queries against at compile time,
    # and which .sqlx/ has to match.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Apply migrations
        run: sqlx migrate run --source supabase/migrations

      - name: Check the offline query data
        run: cargo sqlx prepare --check --workspace -- --all-features --all-targets

      - name: Clippy
        run: cargo clippy --all-features --all-targets --locked --workspace -- -D warnings

      - name: Test
        run: cargo test --all-features --locked --workspace

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # With no DATABASE_URL, sqlx checks queries against .sqlx/.
      - name: Build the fullstack app
        run: dx build --locked --package web --platform web

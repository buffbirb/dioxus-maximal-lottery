name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        shell: devenv --quiet shell -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_swap: true
          remove_tool_cache: true
          rm_cmd: rmz
          rmz_version: "3.1.1"

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Retried because devenv eval can fail nondeterministically with
      # "path '...' is not valid" while registering flake source files in
      # the store; paths added before a failure persist, so retries make
      # monotone progress.
      - name: Build devenv shell
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            devenv --verbose shell -- true && exit 0
            echo "devenv shell eval failed (attempt ${attempt}); retrying"
          done
          exit 1

      - name: Cache Rust crates
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cmd-format: devenv --quiet shell -- {0}

      - name: Run database migrations
        run: |
          for migration in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$migration"
          done

      - name: Run git hooks
        run: prek run --all-files

      - name: Build shared crates
        run: cargo build --locked --package api --package ui --all-features

      # Debug smoke build for PRs and manual runs. On pushes to main the release
      # build below supersedes it and produces the deployable artifact.
      - name: Build fullstack app
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: dx build --locked --package web --platform web

      - name: Run Rust tests
        run: cargo test --locked --package api --package ui --all-features

      - name: Run clippy
        run: cargo clippy --locked --workspace --exclude desktop --exclude mobile --all-targets --all-features -- -D warnings

      # --- Release + publish, only on pushes to main (after the gates above) ---

      # Release fullstack bundle. `dx bundle` (not `dx build`) emits the deployable
      # layout: target/dx/web/release/web/{server,public}. Runs against the CI
      # postgres service (migrations already applied), so the sqlx macros
      # type-check online — no committed .sqlx cache is needed.
      - name: Build release artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: dx bundle --locked --package web --platform web --release

      # Assemble the OCI image with dockerTools (fully in CI; Render never builds).
      - name: Build container image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: nix-build image.nix --argstr tag "sha-${GITHUB_SHA}" -o result

      # Daemonless push of the gzipped docker-archive to GHCR.
      - name: Push image to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          creds="${{ github.actor }}:${{ github.token }}"
          skopeo copy --insecure-policy docker-archive:result "docker://ghcr.io/${repo}:sha-${GITHUB_SHA}" --dest-creds "$creds"
          skopeo copy --insecure-policy docker-archive:result "docker://ghcr.io/${repo}:main" --dest-creds "$creds"

      # Tell Render to pull and redeploy the new :main image.
      - name: Trigger Render deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

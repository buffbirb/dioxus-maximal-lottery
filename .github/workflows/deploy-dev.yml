# Deploy a container image to the dev Render service.
#
# Automatic triggers on main deploy the SHA that the Build image workflow
# pushed, then promote that SHA to :dev so the Render blueprint stays accurate.
# Manual runs deploy a specific SHA and promote it to :dev the same way.

name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA of the image to deploy (must already exist in GHCR)
        type: string
        required: true
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    permissions:
      actions: write
      contents: read
      packages: write

    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      image_tag: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}

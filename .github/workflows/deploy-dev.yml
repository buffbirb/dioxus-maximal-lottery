# Deploy a container image to the dev Render service.
#
# Every push to main that passes CI is built here, deployed, then promoted to
# :dev so the Render blueprint stays accurate. A commit that main has already
# moved past is skipped, since the newer one deploys after it. Manual CI runs
# never trigger this auto-deploy.
#
# Manual runs are one step: pick a branch (or type any ref), and the image is
# built, pushed, deployed, and promoted to :dev the same way.

name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the branch selected above)
        type: string
        required: false
      run_migrations:
        description: Run Supabase migrations before deploying (disable for image-only rollbacks)
        type: boolean
        required: true
        default: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.workflow_run.head_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deploy SHA
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      exists: ${{ steps.resolve.outputs.exists }}
      sha: ${{ steps.resolve.outputs.sha }}
      stale: ${{ steps.resolve.outputs.stale }}

    steps:
      # CI_SHA is the commit CI ran on. This run's own SHA is main's head when
      # it started, which a later push may already have moved.
      - name: Resolve ref and check image
        id: resolve
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/maximal-lottery-web"
          remote="https://github.com/${{ github.repository }}.git"
          stale=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            sha="${CI_SHA}"
            if [ "$(git ls-remote "${remote}" refs/heads/main | cut -f1)" != "${sha}" ]; then
              stale=true
            fi
          else
            ref="${INPUT_REF:-${GITHUB_REF_NAME}}"
            sha=$(git ls-remote "${remote}" "${ref}" | head -n1 | cut -f1)
            if [ -z "${sha}" ]; then
              sha="${ref}"
            fi
          fi
          if skopeo inspect --creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${repo}:${sha}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          {
            echo "exists=${exists}"
            echo "sha=${sha}"
            echo "stale=${stale}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build image
    needs: [resolve]
    if: needs.resolve.outputs.exists != 'true' && needs.resolve.outputs.stale != 'true'

    permissions:
      actions: read
      contents: read
      packages: write

    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: Deploy dev
    needs: [resolve, build]
    if: >-
      ${{ always()
          && needs.resolve.result == 'success'
          && needs.resolve.outputs.stale != 'true'
          && (needs.build.result == 'success' || needs.build.result == 'skipped') }}

    permissions:
      actions: write
      contents: read
      packages: write

    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      image_tag: ${{ needs.resolve.outputs.sha }}
      ref: ${{ needs.resolve.outputs.sha }}
      run_migrations: ${{ inputs.run_migrations || github.event_name == 'workflow_run' }}

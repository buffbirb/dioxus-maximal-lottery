# Deploy a container image to the dev Render service.
#
# Automatic triggers on main deploy the SHA that the Build image workflow
# pushed, then promote that SHA to :dev so the Render blueprint stays accurate.
# Manually-dispatched Build image runs never trigger this auto-deploy.
#
# Manual runs are one step: pick a branch (or type any ref), and the image is
# built, pushed, deployed, and promoted to :dev the same way.

name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the branch selected above)
        type: string
        required: false
      run_migrations:
        description: Run Supabase migrations before deploying (disable for image-only rollbacks)
        type: boolean
        required: true
        default: true
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.workflow_run.head_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    if: github.event_name == 'workflow_dispatch'

    permissions:
      actions: read
      contents: read
      packages: write

    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}

  deploy:
    name: Deploy dev
    needs: [build]
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_dispatch' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event != 'workflow_dispatch')
      ) }}

    permissions:
      actions: write
      contents: read
      packages: write

    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.sha || github.event.workflow_run.head_sha }}
      ref: ${{ needs.build.outputs.sha || github.event.workflow_run.head_sha }}
      run_migrations: ${{ inputs.run_migrations || github.event_name == 'workflow_run' }}

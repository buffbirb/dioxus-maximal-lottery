# Manually deploy a release tag to the prd Render service.
#
# Flow:
# 1. Create a release through the GitHub UI, which creates a tag (e.g. v1.2.3).
#    The Build workflow pushes the corresponding :v1.2.3 image.
# 2. Run this workflow with that tag. It resolves the tag to a SHA, runs
#    Supabase migrations from that SHA, deploys the :v1.2.3 image via the
#    Render deploy hook, and then retags that image as :prd so the Render
#    blueprint remains accurate.

name: Deploy prd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (e.g. v1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve SHA from tag
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve tag SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  supabase:
    name: Deploy Supabase prd
    runs-on: ubuntu-latest
    needs: resolve
    environment: prd

    permissions:
      contents: read

    steps:
      - name: Checkout ${{ needs.resolve.outputs.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push

  render:
    name: Deploy Render prd
    runs-on: ubuntu-latest
    needs: supabase
    environment: prd

    steps:
      - name: Deploy Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          img_url="ghcr.io/${{ github.repository_owner }}/maximal-lottery-web:${{ inputs.tag }}"
          encoded_img_url=$(jq -nr --arg v "${img_url}" '$v|@uri')
          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK}?imgURL=${encoded_img_url}"

  promote:
    name: Promote tag to :prd
    runs-on: ubuntu-latest
    needs: render
    if: needs.render.result == 'success'

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: devenv --quiet shell -- bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv

      - name: Retag release image as :prd
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/maximal-lottery-web"
          skopeo copy --insecure-policy \
            "docker://${repo}:${{ inputs.tag }}" \
            "docker://${repo}:prd" \
            --src-creds "${{ github.actor }}:${GHCR_TOKEN}" \
            --dest-creds "${{ github.actor }}:${GHCR_TOKEN}"

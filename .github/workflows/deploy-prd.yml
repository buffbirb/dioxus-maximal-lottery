name: Deploy prd

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (defaults to latest main)
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prd
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prd
      sha: ${{ inputs.sha || github.sha }}

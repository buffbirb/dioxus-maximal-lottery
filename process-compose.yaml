version: "0.5"

# Local dev stack: postgres -> migrate -> web, in that order. Run via
# `make go`, which evaluates `mise env` (postgres/sqlx/dx on PATH; $PGDATA,
# $DATABASE_URL, $BASIC_AUTH_ENABLED and any mise.local.toml secrets set by
# mise) and exports $WEB_HOST and $WEB_PORT.
processes:
  postgres:
    command: |
      set -e
      data="$PGDATA"
      if [ ! -s "$data/PG_VERSION" ]; then
        initdb -D "$data" -U postgres --auth=trust -E UTF8
      fi
      exec postgres -D "$data" -h 127.0.0.1 -p 5432 -k /tmp
    readiness_probe:
      exec:
        command: pg_isready -h 127.0.0.1 -p 5432 -U postgres
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30
    shutdown:
      signal: 2 # SIGINT: postgres's "fast" shutdown

  migrate:
    depends_on:
      postgres:
        condition: process_healthy
    # Same command as CI and devenv's db:migrate: applies only what
    # _sqlx_migrations hasn't recorded, so new migrations land on every start.
    command: sqlx migrate run --source supabase/migrations

  web:
    depends_on:
      migrate:
        condition: process_completed_successfully
    command: dx serve --package web --platform web --addr ${WEB_HOST} --port ${WEB_PORT}
